[project]
name = "aether"
version = "3.0.0"
description = "Gauge-aware cooperative localization and tracking over degraded radio links"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coopsim*"]

[tool.setuptools.package-data]
coopsim = ["../configs/*.yaml"]
